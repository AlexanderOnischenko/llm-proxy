use_cases:
  - id: UC-1
    title: Принимать и исполнять чат-запрос с приоритетами и метриками
    alias: AcceptAndExecuteChatCompletion
    goal: Обеспечить приём OpenAI-совместимого чат-запроса с учётом приоритетов и возвратом метрик очереди
    primary_actor: Клиентское приложение
    secondary_actors: [Приоритетная очередь, LLM-провайдер]
    preconditions:
      - Конфигурация приоритетов и лимитов очереди загружена
      - Сервис работает в одиночном процессе и очередь доступна
      - Значение приоритета клиента указано или может быть взято по умолчанию
    main_flow:
      - id: "1"
        text: Клиент отправляет HTTP POST на чат-эндпоинт с запросом и необязательным приоритетом
      - id: "2"
        text: Сервис валидирует тело запроса и выбранный приоритет, отклоняя неподдерживаемые приоритеты с нулевой ёмкостью
      - id: "3"
        text: Генерируется уникальный request_id и фиксируются временные метки для расчёта задержек
      - id: "4"
        text: Проверяется доступность слота по приоритету и глубина очереди, после чего запрос ставится в очередь или сразу отправляется на выполнение
      - id: "5"
        text: Запрос выполняется провайдером с применением значений по умолчанию и использованием общего кэша
      - id: "6"
        text: Ответ возвращается клиенту с request_id и метриками очереди в заголовках, после чего ресурсы слота освобождаются и метрики обновляются
    alternate_flows:
      - name: Невалидное тело или запрещённый стриминг
        steps:
          - id: "2a"
            text: Если валидация тела или параметр stream не проходят правила, сервис отвечает 400 с деталями ошибки без постановки в очередь
      - name: Неизвестный или отключённый приоритет
        steps:
          - id: "2b"
            text: Если приоритет отсутствует в конфигурации или имеет нулевую ёмкость, сервис отвечает 400 с кодом приоритетной ошибки
      - name: Переполнение очереди
        steps:
          - id: "4a"
            text: Если max_queue исчерпан и нет мгновенного слота, сервис отвечает 429 queue_overflow без генерации выполнения
      - name: Ошибка провайдера
        steps:
          - id: "5a"
            text: Если провайдер возвращает ошибку, сервис проксирует 500 provider_error, освобождая захваченные слоты и обновляя метрики
    postconditions:
      - Успешный запрос имеет уникальный request_id и статус выполнения зафиксирован в метриках очереди и латентности
      - Занятые слоты по приоритету возвращены в доступное состояние после выполнения
    artifacts_created:
      - request_id
      - Метрики задержек очереди и провайдера
    events_emitted:
      - RequestQueued
      - RequestCompleted
    related_features:
      - LLM Proxy Core Priority Admission and Execution Tracking
    non_functional:
      - Определённые заголовки x-llm-proxy-* содержат показатели очереди и задержек
      - Сохраняется детерминированный порядок по приоритетам в пределах доступных слотов
      - Счётчики и таймеры обновляются для наблюдаемости через Prometheus
    state_driven: true

  - id: UC-2
    title: Выполнить invoke-запрос с возвратом метрик в теле ответа
    alias: InvokeChatWithInlineMetrics
    goal: Предоставить интроспекцию по задержкам очереди для invoke-запросов вместе с результатом выполнения
    primary_actor: Интеграция по invoke-эндпоинту
    secondary_actors: [Приоритетная очередь, LLM-провайдер]
    preconditions:
      - Интеграция использует совместимый формат invoke и указывает допустимый приоритет
      - Конфигурация очереди активна и не превышает лимиты
    main_flow:
      - id: "1"
        text: Интеграция отправляет POST на invoke-эндпоинт с телом ChatCompletionRequest и желаемым приоритетом
      - id: "2"
        text: Сервис валидирует тело и приоритет, генерирует request_id и фиксирует входные метки
      - id: "3"
        text: Запрос размещается в приоритетной очереди или немедленно исполняется, учитывая лимиты inflight и max_queue
      - id: "4"
        text: После выполнения результат дополнен метриками очереди и возвращён в теле ответа вместе с request_id
      - id: "5"
        text: Метрики по очереди, inflight и латентности обновлены; слот приоритета освобождён
    alternate_flows:
      - name: Валидация не пройдена
        steps:
          - id: "2a"
            text: При ошибке схемы тела, stream=True или неправильном приоритете сервис отвечает 400 и не ставит задачу в очередь
      - name: Переполнение или недоступный слот
        steps:
          - id: "3a"
            text: При превышении max_queue или отсутствии слота при max_queue=0 сервис возвращает 429 queue_overflow
      - name: Ошибка провайдера на выполнении
        steps:
          - id: "4a"
            text: При сбое upstream сервис возвращает 500 provider_error с фиксацией в метриках
    postconditions:
      - Ответ содержит request_id и метрики выполнения в теле и заголовках
      - Обновлённые показатели позволяют операторам видеть очередь, inflight и задержки invoke-запросов
    artifacts_created:
      - request_id
      - Показатели задержек invoke и провайдера
    events_emitted:
      - InvokeQueued
      - InvokeCompleted
    related_features:
      - LLM Proxy Core Priority Admission and Execution Tracking
    non_functional:
      - Метрики доступны в теле и заголовках для удобства интеграций
      - Должна соблюдаться монотонность счётчиков Prometheus в однопоточном режиме
    state_driven: true

  - id: UC-3
    title: Адаптировать LangChain-совместимый запрос через внутренний эндпоинт /llm
    alias: AdaptLangChainRequestToPriorityQueue
    goal: Обеспечить внутренним сервисам те же правила очереди и метрик через LangChain-совместимый маршрут
    primary_actor: Внутренний сервис или интеграция LangChain
    secondary_actors: [Приоритетная очередь, LLM-провайдер]
    preconditions:
      - Эндпоинт /llm доступен и настроен на преобразование к ChatCompletionRequest
      - Конфигурация приоритетов определена и имеет положительные ёмкости
    main_flow:
      - id: "1"
        text: Интеграция отправляет запрос на /llm в LangChain-совместимом формате
      - id: "2"
        text: Сервис нормализует запрос к ChatCompletionRequest, включая модель, temperature и приоритет по умолчанию при отсутствии ввода
      - id: "3"
        text: Выполняется валидация и присвоение request_id, после чего запрос помещается в приоритетную очередь с учётом лимитов
      - id: "4"
        text: Запрос выполняется через провайдера с общим кэшем и настройками по умолчанию
      - id: "5"
        text: Ответ возвращается в формате, совместимом с LangChain, дополняясь request_id и метриками очереди
    alternate_flows:
      - name: Ошибка нормализации или неподдерживаемый формат
        steps:
          - id: "2a"
            text: Если входной формат или параметры не могут быть приведены к ChatCompletionRequest, возвращается 400 без постановки в очередь
      - name: Конфигурация приоритета недоступна
        steps:
          - id: "3a"
            text: При отсутствии ёмкости приоритета или при переполнении max_queue возвращается 429 queue_overflow или 400 при невалидном приоритете
      - name: Сбой провайдера
        steps:
          - id: "4a"
            text: При ошибке выполнения сервис возвращает 500 provider_error, освобождая занятые слоты
    postconditions:
      - LangChain-клиент получает ответ с request_id и метриками, отражающими очередную задержку и латентность
      - Приоритетные слоты и очереди возвращены в актуальное состояние после завершения
    artifacts_created:
      - request_id
      - Метрики по очереди для вызовов /llm
    events_emitted:
      - LangChainRequestQueued
      - LangChainRequestCompleted
    related_features:
      - LLM Proxy Core Priority Admission and Execution Tracking
    non_functional:
      - Общий кэш используется без обхода приоритета очереди
      - Соблюдается единое поведение очереди для внутренних и публичных маршрутов
    state_driven: true

  - id: UC-4
    title: Наблюдать метрики очереди и выполнения через /metrics
    alias: ObserveQueueMetrics
    goal: Позволить операторам отслеживать глубину очереди, inflight и задержки для реакции на деградацию
    primary_actor: Оператор или SRE
    secondary_actors: [Система мониторинга]
    preconditions:
      - Сервис запущен с включённой экспозицией Prometheus
    main_flow:
      - id: "1"
        text: Оператор запрашивает GET на /metrics
      - id: "2"
        text: Сервис агрегирует текущие счётчики очереди, inflight и задержек, формируя вывод в формате Prometheus
      - id: "3"
        text: Ответ возвращается оператору или системе мониторинга для дальнейших алертов
    alternate_flows: []
    postconditions:
      - Актуальные показатели очереди доступны для мониторинга и алертинга
    artifacts_created: []
    events_emitted: []
    related_features:
      - LLM Proxy Core Priority Admission and Execution Tracking
    non_functional:
      - Экспозиция должна работать в однопроцессном режиме без нарушений монотонности счётчиков
    state_driven: false

  - id: UC-5
    title: Проверить однопроцессный режим и инициализировать зависимости при старте
    alias: EnforceSingleWorkerStartup
    goal: Гарантировать корректную работу счётчиков очереди и провайдера в однопроцессной конфигурации
    primary_actor: Процесс инициализации сервиса
    secondary_actors: [Система конфигурации]
    preconditions:
      - Доступны переменные окружения и конфигурационные файлы
    main_flow:
      - id: "1"
        text: При старте сервис проверяет отсутствие многопроцессных настроек и запрещённого окружения для метрик
      - id: "2"
        text: При условии прохождения проверки инициализируются общие зависимости кэша, провайдера и очереди в единственном экземпляре
      - id: "3"
        text: Сервис готов к приёму запросов с корректной счётностью метрик
    alternate_flows:
      - name: Обнаружен многопроцессный контекст
        steps:
          - id: "1a"
            text: Если обнаружены переменные многопроцессного режима, сервис прекращает запуск или сигнализирует об ошибке конфигурации
    postconditions:
      - Запуск завершён только в однопроцессном режиме с корректно инициализированными очередью и кэшем
    artifacts_created:
      - Инициализированные единичные экземпляры зависимостей
    events_emitted: []
    related_features:
      - LLM Proxy Core Priority Admission and Execution Tracking
    non_functional:
      - Запрет многопроцессного режима предотвращает рассинхронизацию счётчиков
    state_driven: false
